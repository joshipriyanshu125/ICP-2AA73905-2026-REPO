      <text x="309" y="474" fill="#90abb8" font-size="10">WEEKS 4–5</text>
      <text x="523" y="474" fill="#93a486" font-size="10">WEEK 6</text>
      <g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m256 448 9-9m-8 0h8v8" stroke="#b2a588"/>
        <path d="m470 448 9-9m-8 0h8v8" stroke="#98b3bf"/>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative overview of Personal Portfolio</title>
  <desc id="desc">Original illustrative artwork showing a charcoal portfolio concept for Priyanshu Joshi, with a PJ monogram, a MERN developer and AI enthusiast introduction, and three project cards. This is not an application screenshot.</desc>
